# Cloud build for HAINTEL: builds on a Codemagic Mac and uploads to TestFlight.
# Setup (once, in Codemagic): Team settings → Integrations → App Store Connect → add an API key named "HAINTEL ASC".
# Then add GoogleService-Info.plist as a base64 secure variable GOOGLE_SERVICE_INFO_PLIST in group "firebase".
workflows:
  ios-testflight:
    name: HAINTEL → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: HAINTEL ASC
    environment:
      xcode: latest
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.haintel
    scripts:
      - name: Add Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > HAINTEL/GoogleService-Info.plist
          fi
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build
        script: |
          xcode-project build-ipa --project HAINTEL.xcodeproj --scheme HAINTEL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
